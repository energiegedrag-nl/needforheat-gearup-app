name: Update yarn.lock (temporary)
# Regenerates yarn.lock on a GitHub runner (the local machine lacks memory) and commits it to this branch.
on:
  push:
    branches: [feat/info-urls]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --ignore-scripts --non-interactive
      - name: Commit yarn.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git diff --cached --quiet || git commit -m "Update yarn.lock (generated on a GitHub runner)" && git push
