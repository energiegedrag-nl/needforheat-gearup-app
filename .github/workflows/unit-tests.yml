name: Unit tests
on: [pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Heat signature (compared with AnonyMate)
        working-directory: apps/expo
        run: yarn jest src/lib/heatSignature
